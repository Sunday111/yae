name: CI

on:
  # A branch with an open pull request would otherwise be built twice: once for the
  # push and once for the pull request.
  push:
    branches: [main]
  pull_request:

# Supersede the runs still going for older commits on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Generated projects run scripts that live in yae-support, and yae decides how
      # they are called, so their tests are here and need a checkout of it.
      - name: Check out yae-support
        uses: actions/checkout@v4
        with:
          repository: Sunday111/yae-support
          path: .yae-support
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run tests
        run: uv run --project . pytest
        env:
          YAE_SUPPORT_ROOT: ${{ github.workspace }}/.yae-support
      - name: Type check
        run: uv run --project . pyright
