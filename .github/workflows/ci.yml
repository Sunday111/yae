name: CI

on:
  workflow_dispatch:
  # A branch with an open pull request would otherwise be built twice: once for the
  # push and once for the pull request.
  push:
    branches: [main]
  pull_request:

# Supersede the runs still going for older commits on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run tests
        run: uv run --project . pytest
      - name: Run generated-project self-test
        run: uv run --project . yae self-test
      - name: Type check
        run: uv run --project . pyright
